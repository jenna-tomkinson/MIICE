[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=1" ]

[tool.poetry]
name = "MIICE"
version = "0.0.1"
description = "Microscopy Image Illumination and Contrast Evaluation"
readme = "README.md"
license = "BSD-3-Clause"
authors = [ "Jenna Tomkinson <jenna.tomkinson@cuanschutz.edu>" ]
keywords = [ "image-analysis", "cellpose", "microscopy", "illumination", "contrast" ]
packages = [ { include = "miice" } ]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
matplotlib = ">=3.10.0"
cellpose = ">=3.0.7,<4.0"
scikit-image = ">=0.25.2"
pandas = ">=2.1.0"
scikit-learn = ">=1.3.0"
PyWavelets = ">=1.6.0"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.0.0,<4.0.0"
pytest = ">=7.0.0,<8.0.0"
pytest-cov = ">=4.0.0,<5.0.0"
black = ">=24.0.0,<25.0.0"
isort = ">=6.0.0,<7.0.0"
coverage = ">=7.0.0,<8.0.0"
jupytext = ">=1.15.0,<2.0.0"
jupyterlab = ">=4.0.0,<5.0.0"
ipykernel = ">=7.1.0,<8.0.0"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [ "tests" ]
